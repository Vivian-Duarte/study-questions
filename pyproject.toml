
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-questions"
version = "0.1.0"
description = "Gerador de perguntas de estudo usando LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/study_questions"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=study_questions --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["study_questions"]

[tool.coverage.report]
show_missing = true
fail_under = 80
